name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg for the voice note tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

  coverage:
    name: Coverage (at least 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg for the voice note tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install coverage==7.17.1
      - run: python -m coverage run -m unittest discover -s tests -t .
      - run: python -m coverage report --include="uplink/*" --fail-under=90

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8 mypy==2.3.1
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy uplink
