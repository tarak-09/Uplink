[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uplink"
version = "0.1.0"
description = "Explains community mesh outages on WhatsApp, in English, Telugu or Hindi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
uplink = "uplink.cli:main"

[tool.setuptools]
packages = ["uplink"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "N", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "UP035", "RUF005"]

[tool.mypy]
python_version = "3.10"
strict = true
